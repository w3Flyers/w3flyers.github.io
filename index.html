<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AppIcon Studio - Android & iOS Icon Generator</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- JSZip for exporting icon bundles -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        .squircle {
            border-radius: 22.5%;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <!-- Header -->
    <header class="bg-white border-b border-slate-200 sticky top-0 z-30 px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center space-x-3">
            <div class="bg-indigo-600 text-white p-2 rounded-xl flex items-center justify-center shadow-md">
                <i data-lucide="smartphone" class="w-6 h-6"></i>
            </div>
            <div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">AppIcon Studio</h1>
                <p class="text-xs text-slate-500">Generate production-ready Android & iOS app icons instantly</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <div class="flex bg-slate-100 p-1 rounded-lg text-sm font-medium">
                <button id="formatPng" onclick="setFormat('png')" class="px-3 py-1.5 rounded-md bg-white shadow-sm text-indigo-600 transition">PNG</button>
                <button id="formatWebp" onclick="setFormat('webp')" class="px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition">WebP</button>
            </div>
            <button onclick="downloadZip()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-5 py-2.5 rounded-xl font-semibold flex items-center space-x-2 shadow-lg shadow-indigo-200 transition transform active:scale-95">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>Download All Icons</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">
        
        <!-- Sidebar Controls -->
        <section class="lg:col-span-4 bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-6">
            <div class="flex items-center justify-between border-b border-slate-100 pb-4">
                <h2 class="font-bold text-lg text-slate-900 flex items-center space-x-2">
                    <i data-lucide="sliders" class="w-5 h-5 text-indigo-600"></i>
                    <span>Customize</span>
                </h2>
                <span class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-full font-medium">Live sync</span>
            </div>

            <!-- Foreground Image Upload -->
            <div>
                <label class="block text-sm font-semibold text-slate-700 mb-2">Foreground Image / Logo</label>
                <label class="border-2 border-dashed border-slate-300 hover:border-indigo-500 rounded-xl p-4 flex flex-col items-center justify-center cursor-pointer bg-slate-50 hover:bg-indigo-50/30 transition group">
                    <div class="bg-white p-3 rounded-full shadow-sm text-indigo-600 mb-2 group-hover:scale-110 transition">
                        <i data-lucide="upload-cloud" class="w-6 h-6"></i>
                    </div>
                    <span class="text-sm font-medium text-slate-700">Click to upload image</span>
                    <span class="text-xs text-slate-400 mt-1">PNG, JPG, or SVG (Min 512x512px)</span>
                    <input type="file" id="imageUpload" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                </label>
            </div>

            <!-- Zoom / Padding Slider -->
            <div class="space-y-2">
                <div class="flex justify-between text-sm">
                    <label class="font-semibold text-slate-700">Icon Zoom / Scale</label>
                    <span id="zoomValue" class="text-indigo-600 font-semibold">100%</span>
                </div>
                <input type="range" id="zoomRange" min="20" max="180" value="100" class="w-full accent-indigo-600 cursor-pointer" oninput="updateZoom(this.value)">
            </div>

            <!-- Background Color -->
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-700">Background Color</label>
                <div class="flex items-center space-x-3">
                    <input type="color" id="bgColor" value="#4F46E5" class="w-12 h-12 rounded-xl border border-slate-200 cursor-pointer p-1 bg-white" onchange="updateBgColor(this.value)">
                    <input type="text" id="bgColorText" value="#4F46E5" class="flex-1 border border-slate-200 rounded-xl px-3 py-2 font-mono text-sm uppercase focus:outline-none focus:ring-2 focus:ring-indigo-500" onchange="updateBgColor(this.value)">
                    <button onclick="setTransparentBg()" class="text-xs bg-slate-100 hover:bg-slate-200 text-slate-700 px-3 py-2.5 rounded-xl font-medium transition">Transparent</button>
                </div>
            </div>

            <!-- File Names Configuration -->
            <div class="space-y-2">
                <label class="block text-sm font-semibold text-slate-700">Android Base File Name</label>
                <input type="text" id="androidName" value="ic_launcher" class="w-full border border-slate-200 rounded-xl px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
            </div>
        </section>

        <!-- Previews Workspace -->
        <section class="lg:col-span-8 space-y-6">
            
            <!-- Live Previews Grid -->
            <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
                <h3 class="font-bold text-lg text-slate-900 mb-6 flex items-center space-x-2">
                    <i data-lucide="eye" class="w-5 h-5 text-indigo-600"></i>
                    <span>Live Previews</span>
                </h3>

                <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 text-center">
                    <!-- Round Icon Preview -->
                    <div class="flex flex-col items-center p-4 rounded-xl bg-slate-50 border border-slate-100">
                        <div class="w-28 h-28 rounded-full overflow-hidden shadow-md bg-white flex items-center justify-center border border-slate-200 mb-3">
                            <canvas id="previewRound" width="200" height="200" class="w-full h-full object-cover"></canvas>
                        </div>
                        <span class="text-sm font-semibold text-slate-700">Round Icon</span>
                        <span class="text-xs text-slate-400">Android Adaptive</span>
                    </div>

                    <!-- Squircle Preview -->
                    <div class="flex flex-col items-center p-4 rounded-xl bg-slate-50 border border-slate-100">
                        <div class="w-28 h-28 squircle overflow-hidden shadow-md bg-white flex items-center justify-center border border-slate-200 mb-3">
                            <canvas id="previewSquircle" width="200" height="200" class="w-full h-full object-cover"></canvas>
                        </div>
                        <span class="text-sm font-semibold text-slate-700">Squircle Icon</span>
                        <span class="text-xs text-slate-400">iOS / Android</span>
                    </div>

                    <!-- Legacy Square Preview -->
                    <div class="flex flex-col items-center p-4 rounded-xl bg-slate-50 border border-slate-100">
                        <div class="w-28 h-28 rounded-2xl overflow-hidden shadow-md bg-white flex items-center justify-center border border-slate-200 mb-3">
                            <canvas id="previewSquare" width="200" height="200" class="w-full h-full object-cover"></canvas>
                        </div>
                        <span class="text-sm font-semibold text-slate-700">Legacy Icon</span>
                        <span class="text-xs text-slate-400">Standard Square</span>
                    </div>
                </div>
            </div>

            <!-- Device Mockup Container -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- iOS Mockup -->
                <div class="bg-slate-900 text-white rounded-2xl p-6 shadow-md flex flex-col items-center relative overflow-hidden">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">iOS Home Screen Simulation</span>
                    <div class="w-48 h-96 bg-slate-800 rounded-[36px] border-4 border-slate-700 p-4 shadow-xl flex flex-col items-center relative">
                        <div class="w-16 h-4 bg-black rounded-full mb-6"></div>
                        <div class="flex flex-col items-center space-y-1">
                            <div class="w-14 h-14 squircle overflow-hidden shadow-lg bg-white">
                                <canvas id="mockupIos" width="120" height="120" class="w-full h-full"></canvas>
                            </div>
                            <span class="text-[11px] font-medium text-slate-200">MyApp</span>
                        </div>
                    </div>
                </div>

                <!-- Android Mockup -->
                <div class="bg-slate-900 text-white rounded-2xl p-6 shadow-md flex flex-col items-center relative overflow-hidden">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400 mb-4">Android Home Screen Simulation</span>
                    <div class="w-48 h-96 bg-slate-800 rounded-[36px] border-4 border-slate-700 p-4 shadow-xl flex flex-col items-center relative">
                        <div class="w-3 h-3 bg-black rounded-full mb-7"></div>
                        <div class="flex flex-col items-center space-y-1">
                            <div class="w-14 h-14 rounded-full overflow-hidden shadow-lg bg-white">
                                <canvas id="mockupAndroid" width="120" height="120" class="w-full h-full"></canvas>
                            </div>
                            <span class="text-[11px] font-medium text-slate-200">MyApp</span>
                        </div>
                    </div>
                </div>
            </div>

        </section>
    </main>

    <!-- JavaScript Application Logic -->
    <script>
        lucide.createIcons();

        let uploadedImage = null;
        let zoomScale = 1.0;
        let bgColor = '#4F46E5';
        let isTransparent = false;
        let currentFormat = 'png';

        window.addEventListener('DOMContentLoaded', () => {
            createDefaultLogo();
        });

        function createDefaultLogo() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.font = 'bold 220px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('⚡', 256, 256);
            
            const img = new Image();
            img.onload = () => {
                uploadedImage = img;
                renderAll();
            };
            img.src = canvas.toDataURL();
        }

        function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const img = new Image();
                img.onload = function() {
                    uploadedImage = img;
                    isTransparent = false;
                    renderAll();
                }
                img.src = e.target.result;
            }
            reader.readAsDataURL(file);
        }

        function updateZoom(val) {
            zoomScale = val / 100;
            document.getElementById('zoomValue').innerText = val + '%';
            renderAll();
        }

        function updateBgColor(color) {
            bgColor = color;
            isTransparent = false;
            document.getElementById('bgColor').value = color;
            document.getElementById('bgColorText').value = color;
            renderAll();
        }

        function setTransparentBg() {
            isTransparent = true;
            renderAll();
        }

        function setFormat(format) {
            currentFormat = format;
            if (format === 'png') {
                document.getElementById('formatPng').className = "px-3 py-1.5 rounded-md bg-white shadow-sm text-indigo-600 transition";
                document.getElementById('formatWebp').className = "px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition";
            } else {
                document.getElementById('formatWebp').className = "px-3 py-1.5 rounded-md bg-white shadow-sm text-indigo-600 transition";
                document.getElementById('formatPng').className = "px-3 py-1.5 rounded-md text-slate-600 hover:text-slate-900 transition";
            }
        }

        function drawIconToContext(ctx, width, height, clipType = 'square') {
            ctx.clearRect(0, 0, width, height);

            ctx.save();
            if (clipType === 'circle') {
                ctx.beginPath();
                ctx.arc(width / 2, height / 2, width / 2, 0, Math.PI * 2);
                ctx.clip();
            } else if (clipType === 'squircle') {
                const radius = width * 0.225;
                ctx.beginPath();
                ctx.roundRect(0, 0, width, height, radius);
                ctx.clip();
            }

            if (!isTransparent) {
                ctx.fillStyle = bgColor;
                ctx.fillRect(0, 0, width, height);
            }

            if (uploadedImage) {
                const imgW = uploadedImage.width;
                const imgH = uploadedImage.height;
                const baseSize = Math.min(width, height) * 0.75 * zoomScale;
                
                let drawW = baseSize;
                let drawH = baseSize;
                if (imgW > imgH) {
                    drawH = baseSize * (imgH / imgW);
                } else {
                    drawW = baseSize * (imgW / imgH);
                }

                const drawX = (width - drawW) / 2;
                const drawY = (height - drawH) / 2;
                ctx.drawImage(uploadedImage, drawX, drawY, drawW, drawH);
            }

            ctx.restore();
        }

        function renderAll() {
            const roundCtx = document.getElementById('previewRound').getContext('2d');
            drawIconToContext(roundCtx, 200, 200, 'circle');

            const squircleCtx = document.getElementById('previewSquircle').getContext('2d');
            drawIconToContext(squircleCtx, 200, 200, 'squircle');

            const squareCtx = document.getElementById('previewSquare').getContext('2d');
            drawIconToContext(squareCtx, 200, 200, 'square');

            const iosCtx = document.getElementById('mockupIos').getContext('2d');
            drawIconToContext(iosCtx, 120, 120, 'squircle');

            const androidCtx = document.getElementById('mockupAndroid').getContext('2d');
            drawIconToContext(androidCtx, 120, 120, 'circle');
        }

        async function downloadZip() {
            const zip = new JSZip();
            const baseName = document.getElementById('androidName').value || 'ic_launcher';
            const mimeType = currentFormat === 'webp' ? 'image/webp' : 'image/png';
            const ext = currentFormat;

            // 1. Android Mipmap Sizes
            const androidSizes = {
                'mipmap-mdpi': 48,
                'mipmap-hdpi': 72,
                'mipmap-xhdpi': 96,
                'mipmap-xxhdpi': 144,
                'mipmap-xxxhdpi': 192
            };

            const androidFolder = zip.folder("android");
            for (const [folder, size] of Object.entries(androidSizes)) {
                const canvas = document.createElement('canvas');
                canvas.width = size;
                canvas.height = size;
                const ctx = canvas.getContext('2d');
                drawIconToContext(ctx, size, size, 'square');
                
                const dataUrl = canvas.toDataURL(mimeType);
                androidFolder.folder(folder).file(`${baseName}.${ext}`, dataUrl.split(',')[1], {base64: true});
                
                const roundCanvas = document.createElement('canvas');
                roundCanvas.width = size;
                roundCanvas.height = size;
                const roundCtx = roundCanvas.getContext('2d');
                drawIconToContext(roundCtx, size, size, 'circle');
                const roundDataUrl = roundCanvas.toDataURL(mimeType);
                androidFolder.folder(folder).file(`${baseName}_round.${ext}`, roundDataUrl.split(',')[1], {base64: true});
            }

            // 2. iOS AppIcon.appiconset
            const iosFolder = zip.folder("ios/AppIcon.appiconset");
            const iosSizes = [
                { size: 20, scale: 2 }, { size: 20, scale: 3 },
                { size: 29, scale: 2 }, { size: 29, scale: 3 },
                { size: 40, scale: 2 }, { size: 40, scale: 3 },
                { size: 60, scale: 2 }, { size: 60, scale: 3 },
                { size: 76, scale: 1 }, { size: 76, scale: 2 },
                { size: 83.5, scale: 2 }, { size: 1024, scale: 1 }
            ];

            let contentsImages = [];
            for (let icon of iosSizes) {
                const actualSize = icon.size * icon.scale;
                const canvas = document.createElement('canvas');
                canvas.width = actualSize;
                canvas.height = actualSize;
                const ctx = canvas.getContext('2d');
                drawIconToContext(ctx, actualSize, actualSize, 'squircle');

                const fileName = `icon_${icon.size}x${icon.size}@${icon.scale}x.${ext}`;
                const dataUrl = canvas.toDataURL(mimeType);
                iosFolder.file(fileName, dataUrl.split(',')[1], {base64: true});

                contentsImages.push({
                    size: `${icon.size}x${icon.size}`,
                    idiom: icon.size === 1024 ? "ios-marketing" : "iphone",
                    filename: fileName,
                    scale: `${icon.scale}x`
                });
            }

            const contentsJson = {
                images: contentsImages,
                info: { version: 1, author: "AppIcon Studio" }
            };
            iosFolder.file("Contents.json", JSON.stringify(contentsJson, null, 2));

            const content = await zip.generateAsync({type: "blob"});
            const link = document.createElement('a');
            link.href = URL.createObjectURL(content);
            link.download = `app-icons-${Date.now()}.zip`;
            link.click();
        }
    </script>
</body>
</html>
